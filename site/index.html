<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 Payloads</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --card: #fff; --fg: #17181c; --muted: #6b6f7a; --line: #e4e6eb;
    --accent: #2563eb; --accent-soft: #e8efff; --chip: #f0f1f4;
    --ok: #15803d; --ok-soft: #e6f6ec; --warn: #b45309; --warn-soft: #fdf1e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --fg: #eceef3; --muted: #9298a5; --line: #262a33;
      --accent: #6c9bff; --accent-soft: #1c2740; --chip: #20242d;
      --ok: #4ade80; --ok-soft: #14291c; --warn: #fbbf24; --warn-soft: #2e2412;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2.5rem 1rem 3rem; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header h1 { margin: 0; font-size: 1.75rem; letter-spacing: -0.01em; }
  header p { margin: .35rem 0 0; color: var(--muted); }
  .source { display: flex; gap: .5rem; margin: 1.25rem 0 .5rem; }
  .source input { flex: 1; min-width: 0; padding: .6rem .75rem; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: inherit; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .btn { padding: .6rem 1rem; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .status { margin: 0 0 1.5rem; color: var(--muted); font-size: 13px; }

  .section-title { margin: 2.5rem 0 .25rem; font-size: 1.25rem; }
  .section-note { margin: 0 0 1rem; color: var(--muted); font-size: 13px; }
  .group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: 1.25rem 0 .75rem; }
  .group-head h3 { margin: 0; font-size: 1rem; }
  .group-head a { font-size: 13px; }
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); }
  .card { display: flex; flex-direction: column; gap: .6rem; padding: 1.1rem 1.2rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; scroll-margin-top: 1rem; transition: box-shadow .2s, border-color .2s; }
  .card:target { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; }
  .card h2 { margin: 0; font-size: 1.05rem; }
  .version { display: inline-flex; align-items: center; gap: .4rem; color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
  .release { padding: .05rem .45rem; border-radius: 999px; font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .release.stable { background: var(--ok-soft); color: var(--ok); }
  .release.pre-release { background: var(--warn-soft); color: var(--warn); }
  .category { align-self: flex-start; padding: .1rem .55rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; }
  .card p { margin: 0; color: var(--muted); }

  .requires { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; font-size: 13px; }
  .requires span { color: var(--muted); }
  .requires a { padding: .1rem .55rem; border: 1px solid var(--line); border-radius: 999px; background: var(--chip); color: var(--fg); }
  .requires a::before { content: "↳ "; color: var(--muted); }

  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem; margin-top: auto; padding-top: .6rem; border-top: 1px solid var(--line); font-size: 13px; }
  .file { color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .links { display: flex; gap: 1rem; margin-left: auto; }
  .sum { display: flex; align-items: center; gap: .4rem; width: 100%; }
  .sum label { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .sum input { flex: 1; min-width: 0; padding: .3rem .5rem; border: 1px solid var(--line); border-radius: 6px; background: var(--chip); color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow: ellipsis; }
  .icon-btn { display: grid; place-items: center; flex: none; width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--muted); cursor: pointer; transition: color .15s, border-color .15s; }
  .icon-btn:hover, .icon-btn.done { color: var(--accent); border-color: var(--accent); }
  .icon-btn svg { width: 14px; height: 14px; }

  footer { margin-top: 2rem; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>PS5 Payloads</h1>
    <p>A custom source for <a href="https://github.com/itsPLK/ps5-payload-manager">PS5 Payload Manager</a>. Add this URL under <b>Settings → Manage Sources</b>.</p>
  </header>

  <div class="source">
    <input id="src" readonly aria-label="Source URL">
    <button id="copy" class="btn" type="button">Copy</button>
  </div>
  <p id="status" class="status">Loading…</p>

  <section id="list" class="grid"></section>

  <section id="external" hidden>
    <h2 class="section-title">From other catalogs</h2>
    <p class="section-note">Included as their authors publish them. Files are checksummed here, but not reviewed.</p>
  </section>

  <footer>Generated from <a href="https://github.com/avoidik/ps5-payloads">avoidik/ps5-payloads</a>. Payloads belong to their authors.</footer>
</main>

<script src="app.js"></script>
</body>
</html>
