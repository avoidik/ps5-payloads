# Payload catalog for a custom PS5 Payload Manager (pldmgr) source.
# Run `npm run build` to regenerate payloads.json from this file.
#
# Top-level fields:
#   name         source name shown in pldmgr          (required)
#   output       generated file                       (default: payloads.json)
#   base_url     public address of the published site; files extracted from archives
#                (source.extract) are served from <base_url>files/
#   external     other catalogs' payloads.json files, included as published:
#                  - name: catalog name, used as its section title on the site (required)
#                    url: link to the payloads.json   (required)
#                    homepage: project page for the Upstream link (default: the GitHub
#                              repo of each file's URL, else of the catalog's URL)
#                Files are still downloaded and checksummed; entries that are not
#                .elf/.bin or fail a check are skipped with a warning.
#   groups       payloads shown together on one site card, by group id:
#                  <id>: {name: card title (required), description: card text}
#                members set `group: <id>` and a short `variant:` label (e.g. 85C)
#   links        useful links shown on the site (not in Payload Manager):
#                  - name: link text                  (required)
#                    url: any http(s) address, or
#                    repo: owner/name                 (a GitHub repository)
#                    description: one line            (default for repo: GitHub's description)
#
# Per-entry fields:
#   id           unique key, referenced by `requires`; published as the payload id that Payload
#                Manager names its install slot after, so keep it stable (a-z 0-9 . _ -)
#   name         display name                        (required)
#   category     grouping in the dashboard            (default: Uncategorized)
#   description  shown in the dashboard
#   requires     list of ids that must be loaded first
#   filename     override the upstream asset name
#   version      override the release tag
#   kind         payload (default): offered in Payload Manager; download: listed on the site only,
#                for apps and archives Payload Manager can't install (extension may be e.g. .zip)
#   group        id of a group in `groups` (optional); needs `variant`, the label of this
#                member on the group's card (e.g. 85C). Only affects the site.
#   enabled      false to leave the entry out without deleting it; it is not looked up
#                or downloaded until re-enabled (default: true)
#   extension    the one file type this provider ships: .elf or .bin (required;
#                pldmgr can't launch anything else, and any other file fails the build)
#   source:
#     type: github -> repo: owner/name, asset: regex matched against release
#                     asset names, tag: (optional) pin a specific release,
#                     prerelease: (optional) true to also consider pre-releases
#                     (default: false, stable releases only)
#     extract: (optional, either type) name of one file inside a .zip asset; that file is
#              extracted, checked against the archive's SHA256SUMS if present, and hosted
#              with the site (needs base_url)
#     type: gitea  -> host: server address (Gitea or Forgejo), then the same fields as
#                     github (repo, asset, tag, prerelease); files are checked against
#                     the release's SHA256SUMS when the server gives no digest
#     type: url    -> url: direct download link, version: (optional),
#                     homepage: (optional) project page linked from the site
#
# Text is published as is; keep names and URLs within Payload Manager's field sizes.

name: PS5 Payloads
output: payloads.json
base_url: https://avoidik.github.io/ps5-payloads/

groups:
  fan-target:
    name: Fan Target
    description: >-
      Sets the fan controller's target temperature below the default 91C, with the automatic fan
      control left on. Runs in the background and restores the target if a game changes it. Use one
      variant only: lower targets make the fan react earlier and run faster; 85C is a good start.

  ps5-dump-forge-desktop:
    name: PS5 Dump Forge (desktop)
    description: >-
      Desktop app and command-line tool of PS5 Dump Forge: convert and edit PS5 game dumps and
      images on a computer, transfer games to and from a console running Forge, and install Forge on
      a PS5 in one click. Nothing to install: unzip and run. Windows 10/11, macOS 11 or later, Linux
      with glibc 2.35 or later.

links:
  - name: PS5PKGTool
    repo: pearlxcore/PS5PKGTool
  - name: ps5-commander
    url: https://commander.s.gy/ps5
    description: >-
      A dual-pane file manager for the PS5 with full gamepad support. It supports internal and
      external storage devices, secure file copying, archives, game images, a built-in text editor,
      and the ability to manually mount games from folders.

external:
  - name: Orbit Store
    url: https://raw.githubusercontent.com/saawant12/orbit-store-ps5/refs/heads/main/payloads.json
    homepage: https://github.com/saawant12/orbit-store-ps5

payloads:
  - id: legacyjb
    name: LegacyJB
    category: Jailbreak
    description: Jailbreak service (TCP 9028) for supported apps such as Homebrew Store and Itemzflow.
    extension: .elf
    source:
      type: github
      repo: Phoenixx1202/LegacyJB
      asset: '^LegacyJB(_[\d.]+)?\.elf$'

  - id: spectrum-library
    enabled: false  # not working at the moment; re-enable once updated
    name: Spectrum Library
    category: Content Managers
    description: Native content manager for browsing and downloading supported game files.
    requires: [legacyjb]
    extension: .elf
    source:
      type: github
      repo: Phoenixx1202/Spectrum-Library
      asset: '^SpectrumLibrary_[\d.]+\.elf$'

  - id: ps5-account-tools
    name: PS5 Account Tools
    category: Utilities
    description: >-
      Local account manager with a web interface on port 6769. Offline activation, fake PSN sign-in
      for features like Remote Play, and avatar changes.
    extension: .elf
    source:
      type: github
      repo: MangoScango/ps5-account-tools
      asset: '^ps5-account-tools-v[\d.]+\.elf$'

  - id: apr-emu-updater
    name: APR Emu Updater
    category: Utilities
    description: >-
      Choose which APR Emu (libSceAmpr.sprx) build each installed game uses, from a web interface on
      port 6971. Needs NanoDNS on first run and ShadowMountPlus for image-installed games.
    extension: .elf
    source:
      type: github
      repo: tsuramatsu1/apr-emu-updater
      asset: '^apr_emu_updater(_v[\d.]+)?\.elf$'

  - id: ps5sx2-helper
    name: PS5SX2 Helper
    category: Emulators
    description: >-
      Helper for PS5SX2, a PCSX2 port for PS5. It jailbreaks the emulator, mounts /data into it, and
      shows PS2 discs as tiles on the home screen. After every restart load ShadowMountPlus first, then
      this helper. Load only one helper.
    extension: .elf
    source:
      type: github
      repo: Swordpdf/PS5SX2
      asset: '^PS5SXHelper\.elf$'

  - id: ps5sx2-installer
    name: PS5SX2 Installer
    category: Emulators
    description: >-
      Installs or updates PS5SX2, a PCSX2 port for PS5, from GitHub and launches it. Needs your own
      PS2 BIOS in /data/PCSX2/bios and games in /data/PCSX2/games.
    requires: [ps5sx2-helper]
    extension: .elf
    source:
      type: github
      repo: Swordpdf/PS5SX2
      asset: '^PS5SX2Installer\.elf$'

  - id: ps5upload
    name: PS5 Upload Helper
    category: Utilities
    description: >-
      Console-side helper for the PS5 Upload app on PC, Mac, Android or web. Resumable uploads,
      package installs, file and game management on port 9120. Enter the 6-digit code it shows in
      the app to pair. Keep the app and helper on the same version.
    extension: .elf
    source:
      type: github
      repo: phantomptr/ps5upload
      asset: '^ps5upload-[\d.]+\.elf$'
      prerelease: true

  - id: shadowmountplus
    name: ShadowMountPlus
    category: Utilities
    description: >-
      Background auto-mounter that detects, mounts and installs game dumps and images from internal
      or external storage (UFS, exFAT, PFS). Needs kstuff-lite 1.07 or newer; load at every boot.
      Settings in /data/shadowmount/config.ini.
    extension: .elf
    source:
      type: github
      repo: drakmor/ShadowMountPlus
      # The zip is in every release; since 1.7beta9 the .elf is no longer attached on its own
      asset: '^ShadowMountPlus_.+\.zip$'
      extract: shadowmountplus.elf
      prerelease: true

  - id: ps4mount
    name: PS4Mount
    category: Utilities
    description: >-
      Plays PS4 fake PKGs straight from an exFAT USB drive without installing them. Put the game and
      update .pkg files in the drive root; it adds them to the home screen. Web panel on port 8770 and
      in the Media tab. Needs fake PKG support (e.g. etaHEN with kstuff) and kernel log access
      (klogsrv on port 3232, or no other payload reading /dev/klog). Load after every boot. Tested on
      firmware 13.20.
    extension: .elf
    source:
      type: github
      repo: gasb07/ps4mount
      asset: '^ps4mount\.elf$'

  - id: rp-get-pin
    name: Remote Play PIN
    category: Utilities
    description: >-
      Shows the Remote Play pairing PIN and account id for the logged-in user on an offline activated
      account, so chiaki, chiaki-ng or the official Remote Play app can pair. Activate the account
      first (e.g. with PS5 Account Tools or offact), reboot if pairing fails, then load this. Load it
      again to cancel pairing.
    extension: .elf
    source:
      type: github
      repo: idlesauce/ps5-remoteplay-get-pin
      asset: '^rp-get-pin\.elf$'

  - id: fan-target-85c
    name: Fan Target 85C
    group: fan-target
    variant: 85C
    category: Utilities
    description: >-
      Sets the fan controller's target temperature to 85C instead of the default 91C, with the
      automatic fan control left on. Runs in the background and restores the target if a game
      changes it. Use one version only: installing another temperature replaces this one.
    extension: .elf
    source:
      type: github
      repo: drakmor/fan_target
      asset: '^fan-target\.zip$'
      extract: fan_target_85c.elf

  - id: fan-target-80c
    name: Fan Target 80C
    group: fan-target
    variant: 80C
    category: Utilities
    description: >-
      Sets the fan controller's target temperature to 80C instead of the default 91C, with the
      automatic fan control left on. Runs in the background and restores the target if a game
      changes it. Use one version only: installing another temperature replaces this one.
    extension: .elf
    source:
      type: github
      repo: drakmor/fan_target
      asset: '^fan-target\.zip$'
      extract: fan_target_80c.elf

  - id: fan-target-75c
    name: Fan Target 75C
    group: fan-target
    variant: 75C
    category: Utilities
    description: >-
      Sets the fan controller's target temperature to 75C instead of the default 91C, with the
      automatic fan control left on. Runs in the background and restores the target if a game
      changes it. Use one version only: installing another temperature replaces this one.
    extension: .elf
    source:
      type: github
      repo: drakmor/fan_target
      asset: '^fan-target\.zip$'
      extract: fan_target_75c.elf

  - id: fan-target-70c
    name: Fan Target 70C
    group: fan-target
    variant: 70C
    category: Utilities
    description: >-
      Sets the fan controller's target temperature to 70C instead of the default 91C, with the
      automatic fan control left on. Runs in the background and restores the target if a game
      changes it. Use one version only: installing another temperature replaces this one.
    extension: .elf
    source:
      type: github
      repo: drakmor/fan_target
      asset: '^fan-target\.zip$'
      extract: fan_target_70c.elf

  - id: fan-target-65c
    name: Fan Target 65C
    group: fan-target
    variant: 65C
    category: Utilities
    description: >-
      Sets the fan controller's target temperature to 65C instead of the default 91C, with the
      automatic fan control left on. Runs in the background and restores the target if a game
      changes it. Use one version only: installing another temperature replaces this one.
    extension: .elf
    source:
      type: github
      repo: drakmor/fan_target
      asset: '^fan-target\.zip$'
      extract: fan_target_65c.elf

  - id: ps5x360-helper
    name: PS5X360 Helper
    category: Emulators
    description: >-
      Autoload helper for PS5X360, an Xbox 360 emulator for PS5 based on Xenia Canary. It keeps the
      PS5X360 app up to date from its GitHub releases. Install the app first (PS5X360 download).
    extension: .elf
    source:
      type: github
      repo: BrinooTk/PS5X360
      asset: '^PS5X360-Helper\.elf$'

  - id: ps5x360
    name: PS5X360
    kind: download
    category: Emulators
    description: >-
      Xbox 360 emulator app for PS5, based on Xenia Canary. Not a payload: extract the zip and copy
      the whole PPSA50011 folder to /data/homebrew/ over FTP, then let ShadowMountPlus register it.
      Needs etaHEN, kstuff and ShadowMountPlus, plus your own Xbox 360 games.
    extension: .zip
    source:
      type: github
      repo: BrinooTk/PS5X360
      asset: '^PPSA50011\.zip$'

  - id: ampr-emu
    name: AMPR Emu
    kind: download
    category: Emulators
    description: >-
      APR Emu (AMPR userland emulation) library, libSceAmpr.sprx, which some games need. Not a
      payload: ShadowMountPlus downloads the latest build by itself, and APR Emu Updater picks a build
      per game. Download it only to install it by hand.
    extension: .sprx
    source:
      type: github
      repo: drakmor/ampr_emu
      asset: '^libSceAmpr\.sprx$'

  - id: playgo-stub
    name: PlayGo Stub
    kind: download
    category: Emulators
    description: >-
      Lightweight replacement for a game's PlayGo runtime library, libScePlayGo.sprx. It reports all
      content chunks and languages as installed, so titles that wait on PlayGo can carry on. Not a
      payload: it replaces the game's own module. Optional settings in playgo_stub.dat in the game
      folder (/app0).
    extension: .sprx
    source:
      type: github
      repo: drakmor/pgo_stub
      asset: '^libScePlayGo\.sprx$'

  - id: dlc-emu
    name: DLC Emu
    kind: download
    category: Emulators
    description: >-
      Replacement modules (libSceAppContent, libSceNpEntitlementAccess, libSceGameUpdate) that make a
      game see the DLC listed in dlc_emu.ini in its folder (/app0) as owned. Not a payload: the zip
      has normal and logging builds of the modules, an example dlc_emu.ini and a helper script.
    extension: .zip
    source:
      type: github
      repo: drakmor/dlc_emu
      asset: '^dlc_emu_[\d.]+\.zip$'

  - id: ps5-ecam
    name: PS5-ECAM
    kind: download
    category: Emulators
    description: >-
      Wii U, 3DS, DS and Switch emulation (Cemu, Azahar, melonDS and Eden) in one launcher for the TV
      and the DualSense. Not a payload: extract the zip, copy the PPSA99360 folder to
      /data/homebrew/, and let your HEN jailbreak the title (etaHEN app list, OnionHEN
      exact_title_ids, or an ELF loader on port 9021). Updates itself from then on.
    extension: .zip
    source:
      type: github
      repo: premohq/PS5-ECAM
      asset: '^PS5-ECAM-v[\d.]+\.zip$'

  - id: ps5lm
    name: PS5LM
    kind: download
    category: Utilities
    description: >-
      Runs GGUF language models with llama.cpp on the console's GPU and serves them to your network
      on port 8081, with OpenAI and Anthropic compatible APIs, a browser chat page and a TV screen.
      Not a payload: extract the zip and copy the PPSA99575 folder to /data/homebrew/ over FTP.
      Needs kstuff-lite, etaHEN and ShadowMountPlus; firmware 7.00 to 13.60.
    extension: .zip
    source:
      type: github
      repo: cobanov/PS5LM
      asset: '^ps5lm-app-v[\d.]+\.zip$'

  - id: neoenabler
    name: NeoEnabler
    category: Utilities
    description: >-
      Starts PS4 games without PS4 Pro support in Pro mode, so game patches can raise them to higher
      resolutions, up to native 4K; only useful for games that have a NeoEnabler patch. Load
      ps-patch-system first, then this, after every boot. Pick patches in the panel on port 8765 or
      in the Media tab.
    extension: .elf
    source:
      type: github
      repo: gasb07/NeoEnabler
      asset: '^neo-manager\.elf$'

  - id: lz4-compression
    name: LZ4 Compression Engine
    category: Utilities
    description: >-
      Engine of LZ4 Compression, which shrinks installed PS5 games on the console with LZ4 asset
      packs and .ffpfsc compression. Serves the LZ4 Compression app and a web page on port 5920.
      If the app doesn't start it by itself, load it here first, then open the app.
    extension: .elf
    source:
      type: gitea
      host: https://theghostonline.dev
      repo: theghostonline/PS5-LZ4-Compression
      asset: '^lz4-compression\.elf$'

  - id: lz4-compression-app
    name: LZ4 Compression
    kind: download
    category: Utilities
    description: >-
      The LZ4 Compression app (PPSA99420), which shrinks installed games on the console. Extract the
      zip and copy the PPSA99420 folder to /data/homebrew/ over FTP; ShadowMountPlus adds the tile.
      Needs the LZ4 Compression Engine payload. Updates itself, engine included.
    extension: .zip
    source:
      type: gitea
      host: https://theghostonline.dev
      repo: theghostonline/PS5-LZ4-Compression
      asset: '^LZ4-Compression-PPSA99420\.zip$'

  - id: game-updater
    name: Game Updater Engine
    category: Utilities
    description: >-
      Engine of Game Updater, which finds and installs the newest official update for installed PS5
      games, with a backport when an update needs newer firmware. Serves the Game Updater app and a
      web page on port 7920. If the app doesn't start it by itself, load it here first, then open
      the app.
    extension: .elf
    source:
      type: gitea
      host: https://theghostonline.dev
      repo: theghostonline/PS5-Game-Updater
      asset: '^game-updater\.elf$'

  - id: game-updater-app
    name: Game Updater
    kind: download
    category: Utilities
    description: >-
      The Game Updater app (PPSA99440): update installed PS5 games in a few taps, on the console.
      Extract the zip and copy the PPSA99440 folder to /data/homebrew/ over FTP. Needs the Game
      Updater Engine payload.
    extension: .zip
    source:
      type: gitea
      host: https://theghostonline.dev
      repo: theghostonline/PS5-Game-Updater
      asset: '^Game-Updater-PPSA99440\.zip$'

  - id: pegasus-dl-plus
    name: Pegasus DL+
    kind: download
    category: Downloaders
    description: >-
      Native app (formerly the Pegasus DL payload): browse catalogs, queue downloads, extract
      archives and install packages on the PS5 with the controller. Copy PPSA99998.ffpfsc into your
      loader's homebrew folder (ShadowMountPlus mounts it), refresh and launch Pegasus DL+. Updates
      itself; sends app launch and reliability diagnostics.
    extension: .ffpfsc
    source:
      type: github
      repo: pegasus-ps5/pegasus-dl
      asset: '^PPSA99998\.ffpfsc$'

  - id: ps5-dump-forge
    name: PS5 Dump Forge
    category: Utilities
    description: >-
      Converts and edits PS5 game dumps and images on the console: game folders, exfat, ffpkg,
      ffpfs, ffpfsc and FPKG, also straight from zip, 7z and rar, with transfers to other Forge
      instances and NAS shares (SMB, FTP, NFS). Open http://<PS5 IP>:8095 in any browser.
    extension: .elf
    source:
      type: github
      repo: quer3q/ps5-dump-forge
      asset: '^ps5-dump-forge-[\d.]+-ps5\.elf$'

  - id: ps5-dump-forge-windows-x86-64
    name: PS5 Dump Forge for Windows x86-64
    kind: download
    group: ps5-dump-forge-desktop
    variant: Windows x86-64
    category: Utilities
    extension: .zip
    source:
      type: github
      repo: quer3q/ps5-dump-forge
      asset: '^ps5-dump-forge-[\d.]+-windows-x86-64\.zip$'

  - id: ps5-dump-forge-windows-x86-64-webview2
    name: PS5 Dump Forge for Windows x86-64 (bundled WebView2)
    kind: download
    group: ps5-dump-forge-desktop
    variant: Windows x86-64 (bundled WebView2)
    category: Utilities
    extension: .zip
    source:
      type: github
      repo: quer3q/ps5-dump-forge
      asset: '^ps5-dump-forge-[\d.]+-windows-x86-64-webview2\.zip$'

  - id: ps5-dump-forge-windows-arm64
    name: PS5 Dump Forge for Windows arm64
    kind: download
    group: ps5-dump-forge-desktop
    variant: Windows arm64
    category: Utilities
    extension: .zip
    source:
      type: github
      repo: quer3q/ps5-dump-forge
      asset: '^ps5-dump-forge-[\d.]+-windows-arm64\.zip$'

  - id: ps5-dump-forge-macos
    name: PS5 Dump Forge for macOS (universal)
    kind: download
    group: ps5-dump-forge-desktop
    variant: macOS (universal)
    category: Utilities
    extension: .zip
    source:
      type: github
      repo: quer3q/ps5-dump-forge
      asset: '^ps5-dump-forge-[\d.]+-macos-universal\.zip$'

  - id: ps5-dump-forge-linux-x86-64
    name: PS5 Dump Forge for Linux x86-64
    kind: download
    group: ps5-dump-forge-desktop
    variant: Linux x86-64
    category: Utilities
    extension: .tar.gz
    source:
      type: github
      repo: quer3q/ps5-dump-forge
      asset: '^ps5-dump-forge-[\d.]+-linux-x86-64\.tar\.gz$'

  - id: ps5-dump-forge-linux-arm64
    name: PS5 Dump Forge for Linux arm64
    kind: download
    group: ps5-dump-forge-desktop
    variant: Linux arm64
    category: Utilities
