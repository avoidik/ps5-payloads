name: Generate and publish payloads.json

on:
  push:
    branches: [main]
    paths:
      - catalog.yaml
      - generate.mjs
      - eslint.config.js
      - tools/**
      - package.json
      - package-lock.json
      - site/**
      - .github/workflows/generate.yml
  pull_request:
    paths:
      - catalog.yaml
      - generate.mjs
      - eslint.config.js
      - tools/**
      - package.json
      - package-lock.json
      - site/**
      - .github/workflows/generate.yml
  schedule:
    # Every 6 hours, to pick up new upstream releases
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      # Commit holding the published payloads.json (the bot's commit, if it made one)
      sha: ${{ steps.published.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch itself, not a detached commit, so the bot can push to it
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Generate payloads.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node generate.mjs

      - name: Check for changes
        id: diff
        run: |
          # git diff ignores untracked files, so a missing payloads.json must be caught separately
          if ! git ls-files --error-unmatch payloads.json >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "payloads.json is not tracked yet; it will be added."
          # generated_at changes on every run; ignore it so only real updates are committed
          elif git diff --quiet -I '"generated_at"' -- payloads.json; then
            git checkout -- payloads.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No payload changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- payloads.json
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: payloads.json
          path: payloads.json

      - name: Commit payloads.json
        if: steps.diff.outputs.changed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add payloads.json
          git commit -m "Update payloads.json"
          git push

      - name: Record published commit
        id: published
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp site/* payloads.json _site/

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  verify:
    needs: generate
    # Informational: a failure is reported as a warning but never fails the run or blocks the deploy
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.generate.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: payloads.json
          path: generated

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install libcurl headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev

      - name: Verify with Payload Manager's own code
        run: |
          node tools/pldmgr-verify/verify.mjs generated/payloads.json || {
            echo "::warning::Payload Manager could not process payloads.json; see the verify job"
            exit 1
          }

  deploy:
    needs: generate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
